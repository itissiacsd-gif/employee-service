name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn clean verify

      - name: SonarCloud Scan
    env:
    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    run: |
    mvn sonar:sonar \
      -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: employee-service
          path: target/*.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t employee-service:${{ github.sha }} .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: employee-service:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag employee-service:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/employee-service:latest
          docker tag employee-service:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/employee-service:${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/employee-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/employee-service:${{ github.sha }}
